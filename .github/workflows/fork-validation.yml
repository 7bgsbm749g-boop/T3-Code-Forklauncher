name: Fork release feed checks

on:
  pull_request:
  push:
    branches:
      - forklauncher
      - forklauncher-stable-v0.0.44-candidate

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  windows-feed-slugs:
    name: Windows feed slug fixtures
    if: github.repository != 'pingdotgg/t3code'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout source without credentials
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fetch_ref="$CHECKOUT_REF"
          if [[ -n "$PULL_REQUEST_NUMBER" ]]; then fetch_ref="refs/pull/${PULL_REQUEST_NUMBER}/merge"; fi
          git fetch --no-tags --depth=1 origin "$fetch_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - name: Execute PowerShell bootstrap validation fixtures
        shell: pwsh
        run: ./scripts/install-feed-slug.test.ps1
  validate:
    name: Release feed and candidate metadata behavior tests
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source without credentials
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fetch_ref="$CHECKOUT_REF"
          if [[ -n "$PULL_REQUEST_NUMBER" ]]; then fetch_ref="refs/pull/${PULL_REQUEST_NUMBER}/merge"; fi
          git fetch --no-tags --depth=1 origin "$fetch_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - name: Check candidate metadata logic
        run: node --test .github/scripts/fork-candidate-metadata.test.mjs .github/scripts/fork-candidate-versions.test.mjs .github/scripts/install-feed-slug.test.mjs
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install focused shared dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/shared...
      - name: Test CLI release feed resolution
        run: vp test run packages/shared/src/cliRelease.test.ts
